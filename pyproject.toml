[project]
name = "pearls-file-tools"
version = "0.22"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.11.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "ui", "workers", "models"]
