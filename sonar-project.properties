sonar.organization=pearl-essence
sonar.projectKey=Pearl-Essence_pearls_file_tools
sonar.projectName=Pearl Post Suite

sonar.sources=.
sonar.exclusions=tests/**,**/pearl_stress_test/**,resources/icons/**,**/__pycache__/**
sonar.tests=tests
sonar.test.inclusions=tests/**

sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.10

# Coverage exclusions — PySide6 UI/worker layers require a running Qt event
# loop and cannot be unit-tested with pytest-cov. They are exercised by the
# GUI smoke test (QT_QPA_PLATFORM=offscreen) instead.
sonar.coverage.exclusions=ui/**,workers/**,main.py,branding.py
