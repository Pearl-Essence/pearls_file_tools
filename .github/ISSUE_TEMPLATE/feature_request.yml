name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: How would this benefit your DIT or post-production workflow?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Offloading / Ingest
        - Proxy Generation
        - Bulk Rename
        - File Organizer
        - Archive Extractor
        - Image Browser
        - Studio Tools
        - Delivery
        - Maintenance
        - UI / Theme
        - Other
    validations:
      required: true
