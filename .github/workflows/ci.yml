name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: "pip install --only-binary :all: pytest==9.0.3 pytest-cov==7.1.0"

      - name: Run tests with coverage
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies for Qt offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 \
            libegl1 \
            libgl1 \
            libopengl0 \
            libglib2.0-0 \
            libfontconfig1 \
            libdbus-1-3 \
            libxcb-xinerama0 \
            libxcb-cursor0

      - name: Install Python dependencies
        run: "pip install --only-binary :all: PySide6==6.11.1"

      - name: Run GUI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_smoke_test.py

  ci-gate:
    if: always()
    needs: [lint, test, smoke]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check all jobs passed
        run: |
          results=("${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.smoke.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "Required job did not succeed: $result"
              exit 1
            fi
          done
          echo "All required jobs passed."
